name: Sync fork from upstream

on:
  schedule:
    # 01:07 UTC = 09:07 Beijing time, daily. Off the hour because top-of-hour
    # schedules are the most likely to be delayed or dropped.
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge upstream default branch into fork default branch
        env:
          # github.token cannot update .github/workflows/ (HTTP 422), so upstream
          # changes to those files need a SYNC_TOKEN with workflow write access.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Uses the merge-upstream API (same as the "Sync fork" button):
          # fast-forwards when possible, otherwise creates a merge commit.
          # Fails with 409 on conflict and leaves the branch unchanged;
          # it never discards fork commits or force-pushes.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch="${GITHUB_REF_NAME}" \
            --jq '"upstream sync: " + .message + " (merge type: " + (.merge_type // "n/a") + ")"'
