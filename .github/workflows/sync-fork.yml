name: Sync fork from upstream

on:
  schedule:
    # 01:07 UTC = 09:07 Beijing time, daily. Off the hour because top-of-hour
    # schedules are the most likely to be delayed or dropped.
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # github.token cannot update .github/workflows/ (HTTP 422 from the
      # merge-upstream API), so push with a write-enabled deploy key instead.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}
          fetch-depth: 0
          filter: blob:none

      - name: Merge upstream default branch into fork default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r upstream_url upstream_branch < <(
            gh api "repos/${GITHUB_REPOSITORY}" --jq '.parent | .clone_url + " " + .default_branch'
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch "${upstream_url}" "${upstream_branch}"
          # Fails on conflict and leaves the branch unchanged; it never
          # discards fork commits or force-pushes.
          git merge --no-edit FETCH_HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
