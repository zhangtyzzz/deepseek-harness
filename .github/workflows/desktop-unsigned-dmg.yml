name: Build unsigned macOS Desktop DMG

on:
  # Manual-only: run when you want a DMG (e.g. after landing a feature or
  # pulling in interesting upstream changes). Re-enable automatic triggers if
  # upstream starts cutting releases.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-unsigned-dmg
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package unsigned macOS DMG (arm64)
        run: pnpm run package:desktop:mac:arm64:unsigned

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-macos-arm64-unsigned
          path: apps/desktop/.desktop-build/targets/*/unsigned-artifacts/*.dmg
          if-no-files-found: error
